{% extends "base.html" %}

{% block content %}
<div style="min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem;">
    <div style="max-width: 500px;">
        <div style="width: 80px; height: 80px; background: var(--danger-bg); color: var(--danger); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1.5rem;">
            <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>
        <h1 style="font-size: 3rem; font-weight: 800; color: var(--danger); margin-bottom: 0.5rem; line-height: 1;">500</h1>
        <h2 style="font-size: 1.35rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.75rem;">Internal Cloud Gateway Error</h2>
        <p style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 1.75rem;">
            An unexpected error occurred while processing the cloud storage request. Our automated monitors have logged the exception.
        </p>
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
                Return to Dashboard
            </a>
            <button onclick="location.reload()" class="btn btn-secondary">
                Retry Action
            </button>
        </div>
    </div>
</div>
{% endblock %}
